services:

  gateway:
    build: ./gateway
    ports:
      - "8000:8000"
    depends_on:
      - user-service
      - task-service
      - payment-service
      - notification-service

  user-service:
    build: ./services/user-service
    ports:
      - "8001:8001"
    environment:
      - SPRING_DATASOURCE_URL=${SUPABASE_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${SUPABASE_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${SUPABASE_DB_PASSWORD}
    env_file:
      - .env

  task-service:
    image: alpine:3.19
    command: sleep infinity
    ports:
      - "8002:8002"

  payment-service:
    build: ./services/payment-service
    ports:
      - "8003:8003"
    environment:
      - DB_HOST=payment-postgres
      - DB_PORT=5432
      - DB_NAME=PaymentService
      - DB_USER=postgres
      - DB_PASSWORD=highway55
      - JWT_SECRET=${JWT_SECRET}
      - PAYHERE_MERCHANT_ID=${PAYHERE_MERCHANT_ID}
      - PAYHERE_MERCHANT_SECRET=${PAYHERE_MERCHANT_SECRET}
    env_file:
      - .env
    depends_on:
      payment-postgres:
        condition: service_healthy

  payment-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: PaymentService
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: highway55
    volumes:
      - payment-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  notification-service:
    image: alpine:3.19
    command: sleep infinity
    ports:
      - "8004:8004"

volumes:
  payment-pgdata: