# =========================================================
# Namespace
# =========================================================

apiVersion: v1
kind: Namespace
metadata:
  name: taskbridge

---

# =========================================================
# ConfigMap - non-sensitive configuration
# Replace DB names with the same values from your .env
# =========================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: taskbridge-config
  namespace: taskbridge
data:
  POSTGRES_USER_DB_NAME: "TaskBridge"
  POSTGRES_TASK_DB_NAME: "TaskService"

  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"

  PAYMENT_DB_HOST: "payment-postgres"
  PAYMENT_DB_PORT: "5432"
  PAYMENT_DB_NAME: "PaymentService"
  PAYMENT_DB_USER: "postgres"

---

# =========================================================
# Secret
#
# IMPORTANT:
# Replace these values with your actual .env values.
#
# stringData lets you write plain strings here for local/demo
# purposes. Kubernetes converts them internally to Secrets.
# =========================================================

apiVersion: v1
kind: Secret
metadata:
  name: taskbridge-secret
  namespace: taskbridge
type: Opaque
stringData:
  POSTGRES_DB_USER: "postgres"
  POSTGRES_DB_PASS: "YOUR_MAIN_POSTGRES_PASSWORD"

  JWT_SECRET: "YOUR_JWT_SECRET"

  PAYMENT_DB_PASSWORD: "highway55"

  PAYHERE_MERCHANT_ID: "1237971"
  PAYHERE_MERCHANT_SECRET: "YOUR_PAYHERE_MERCHANT_SECRET"

---

# =========================================================
# Main PostgreSQL Persistent Volume Claim
# =========================================================

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: taskbridge
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---

# =========================================================
# Main PostgreSQL Deployment
# =========================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: taskbridge
spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: taskbridge-secret
                  key: POSTGRES_DB_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskbridge-secret
                  key: POSTGRES_DB_PASS

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data

            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER"
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc

        - name: postgres-init
          configMap:
            name: postgres-init

---

# =========================================================
# Main PostgreSQL Service
# Internal address:
# postgres:5432
# =========================================================

apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: taskbridge
spec:
  selector:
    app: postgres

  ports:
    - port: 5432
      targetPort: 5432

---

# =========================================================
# Redis Deployment
# =========================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: taskbridge
spec:
  replicas: 1

  selector:
    matchLabels:
      app: redis

  template:
    metadata:
      labels:
        app: redis

    spec:
      containers:
        - name: redis
          image: redis:7-alpine

          ports:
            - containerPort: 6379

          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 3
            periodSeconds: 5

---

# =========================================================
# Redis Service
# Internal address:
# redis:6379
# =========================================================

apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: taskbridge
spec:
  selector:
    app: redis

  ports:
    - port: 6379
      targetPort: 6379

---

# =========================================================
# Payment PostgreSQL PVC
# =========================================================

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: payment-postgres-pvc
  namespace: taskbridge
spec:
  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: 2Gi

---

# =========================================================
# Payment PostgreSQL Deployment
# =========================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-postgres
  namespace: taskbridge
spec:
  replicas: 1

  selector:
    matchLabels:
      app: payment-postgres

  template:
    metadata:
      labels:
        app: payment-postgres

    spec:
      containers:
        - name: payment-postgres
          image: postgres:16

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_DB
              value: "PaymentService"

            - name: POSTGRES_USER
              value: "postgres"

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskbridge-secret
                  key: PAYMENT_DB_PASSWORD

          readinessProbe:
              exec:
                command:
                  - pg_isready
                  - -U
                  - postgres
              initialDelaySeconds: 10
              periodSeconds: 5
              timeoutSeconds: 5
              failureThreshold: 6

          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          volumeMounts:
            - name: payment-postgres-storage
              mountPath: /var/lib/postgresql/data

          

      volumes:
        - name: payment-postgres-storage
          persistentVolumeClaim:
            claimName: payment-postgres-pvc

---

# =========================================================
# Payment PostgreSQL Service
# Internal address:
# payment-postgres:5432
# =========================================================

apiVersion: v1
kind: Service
metadata:
  name: payment-postgres
  namespace: taskbridge
spec:
  selector:
    app: payment-postgres

  ports:
    - port: 5432
      targetPort: 5432

---

# =========================================================
# User Service Deployment
# =========================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: taskbridge
spec:
  replicas: 1

  selector:
    matchLabels:
      app: user-service

  template:
    metadata:
      labels:
        app: user-service

    spec:
      containers:
        - name: user-service
          image: taskbridge-user-service:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8001

          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/$(POSTGRES_USER_DB_NAME)

            - name: POSTGRES_USER_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: taskbridge-config
                  key: POSTGRES_USER_DB_NAME

            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: taskbridge-secret
                  key: POSTGRES_DB_USER

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskbridge-secret
                  key: POSTGRES_DB_PASS

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: taskbridge-secret
                  key: JWT_SECRET

            - name: SPRING_DATA_REDIS_HOST
              value: redis

            - name: SPRING_DATA_REDIS_PORT
              value: "6379"

---

# =========================================================
# User Service
# Internal address:
# user-service:8001
# =========================================================

apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: taskbridge
spec:
  selector:
    app: user-service

  ports:
    - port: 8001
      targetPort: 8001

---

