# 1. Server Configuration
server.port=${PORT:8081}

# 2. Supabase PostgreSQL Connection (JDBC)
spring.datasource.url=${POSTGRES_DB_NAME}
spring.datasource.username=${POSTGRES_DB_USER}
spring.datasource.password=${POSTGRES_DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# 3. Database Connection Pooling (Hikari Settings for Microservices)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000

# 4. JPA / Hibernate Configurations
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# 5. Security - Supabase JWT Verification
# This configures Spring Security OAuth2 Resource Server to decode Supabase tokens
jwt.secret=${SUPABASE_JWT_SECRET}