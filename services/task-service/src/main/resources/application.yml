server:
  port: ${PORT:8002}

spring:
  datasource:
    url: ${POSTGRES_USER_DB_NAME}
    username: ${POSTGRES_DB_USER}
    password: ${POSTGRES_DB_PASS}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:redis}      # "redis" matches the Compose service name — override with localhost for standalone runs
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

app:
  jwt:
    secret: ${JWT_SECRET}