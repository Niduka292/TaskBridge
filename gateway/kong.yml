_format_version: "3.0"

services:
  - name: user-service
    url: http://user-service:8001
    routes:
      - paths:
          - /api/v1/users
          - /api/v1/auth
        strip_path: false

  - name: task-service
    url: http://task-service:8002
    routes:
      - paths:
          - /api/v1/tasks
          - /api/v1/bids
        strip_path: false

  - name: payment-service
    url: http://payment-service:8003
    routes:
      - paths:
          - /api/v1/payments
          - /api/v1/escrow
        strip_path: false

  - name: notification-service
    url: http://notification-service:8004
    routes:
      - paths:
          - /api/v1/notifications
        strip_path: false

plugins:
  - name: rate-limiting
    config:
      minute: 120
      policy: local

  - name: cors
    config:
      origins:
        - http://localhost:3000
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
      exposed_headers:
        - Authorization
      credentials: true
      max_age: 3600