_format_version: "3.0"

services:
  - name: user-service
    url: http://user-service:8001
    routes:
      - name: user-routes
        paths:
          - /auth
          - /users
        strip_path: false

  - name: task-service
    url: http://task-service:8002
    routes:
      - name: task-routes
        paths:
          - /tasks
          - /bids
        strip_path: false

  - name: payment-service
    url: http://payment-service:8003
    routes:
      - name: payment-routes
        paths:
          - /payments
          - /escrow
          - /wallet
        strip_path: false

  - name: notification-service
    url: http://notification-service:8004
    routes:
      - name: notification-routes
        paths:
          - /notifications
        strip_path: false

plugins:
  - name: cors
    config:
      origins:
        - http://localhost:3000
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
      credentials: true

  - name: rate-limiting
    config:
      minute: 100
      policy: local
